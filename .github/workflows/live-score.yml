name: Live Score Stream


on:
  workflow_dispatch:
    inputs:
      cricbuzz_url:
        description: "Cricbuzz live-scores page URL"
        required: true
      match_title:
        description: "(Optional now — auto-detected from Cricbuzz)"
        required: false
        default: ""
      subtitle:
        description: "(Optional now — auto-detected from Cricbuzz)"
        required: false
        default: ""


jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4


      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg


      - name: Install Python deps
        run: pip install requests pillow edge-tts


      - name: Play channel intro (once)
        continue-on-error: true
        run: >
          ffmpeg -hide_banner -loglevel error -re -i assets/intro.mp4
          -vf scale=1280:720 -r 30 -c:v libx264 -preset veryfast -tune zerolatency
          -b:v 2500k -maxrate 3000k -bufsize 6000k -pix_fmt yuv420p -g 60
          -c:a aac -b:a 128k -ar 44100 -ac 2
          -f flv "${{ secrets.YT_RTMP }}"


      - name: Stream to YouTube
        run: >
          python stream_v2.py
          --cricbuzz-url "${{ inputs.cricbuzz_url }}"
          --rtmp "${{ secrets.YT_RTMP }}"
